{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center">
<div class="col-lg-8">
<section class="card shadow-sm">
<div class="card-body p-4">
<h2 class="h4 mb-3">Editar alumno</h2>
<form method="post"
action="{{ url_for('editar', id=alumno._id) }}">
<div class="mb-3">
<label for="nombre" class="form-label">Nombre completo</label>
<input id="nombre" name="nombre" class="form-control"
value="{{ alumno.nombre }}" required maxlength="80">
</div>
<div class="mb-3">
<label for="grupo" class="form-label">Grupo</label>
<input id="grupo" name="grupo" class="form-control"
value="{{ alumno.grupo }}" required maxlength="20">
</div>
<div class="mb-3">
<label for="turno" class="form-label">Turno</label>
<select id="turno" name="turno" class="form-select" required>
<option value="">Selecciona un turno</option>
{% for opcion in ['Matutino', 'Vespertino'] %}
<option value="{{ opcion }}"
{% if alumno.get('turno') == opcion %}selected{% endif %}>
{{ opcion }}
</option>
{% endfor %}
</select>
</div>
<div class="d-flex gap-2 flex-wrap">
<button type="submit" class="btn btn-primary">
Guardar cambios
</button>
<a class="btn btn-outline-secondary"
href="{{ url_for('inicio') }}#lista">Cancelar</a>
</div>
</form>
</div>
</section>
</div>
</div>
{% endblock %}
